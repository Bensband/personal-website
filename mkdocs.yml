site_name: My Personal Website
site_url: https://Bensband.github.io/personal-site/
site_description: My projects, notes, and learning journey
site_author: Your Name

theme:
  name: material

  features:
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - content.code.copy

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

nav:
  - Home: index.md
  - About Me: about.md
  - Projects:
      - Overview: projects/index.md
      - Personal Website: projects/personal-website.md
  - Notes:
      - Programming:
          - Overview: notes/programming/index.md
          - Python: notes/programming/python.md